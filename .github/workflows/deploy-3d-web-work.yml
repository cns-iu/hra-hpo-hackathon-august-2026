name: Deploy 3d-web-work to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '3d-web-work/**'
      - '.github/workflows/deploy-3d-web-work.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 3d-web-work/package-lock.json

      - name: Install dependencies
        working-directory: 3d-web-work
        run: npm ci

      - name: Build
        working-directory: 3d-web-work
        run: npx ng build --configuration production --base-href /hra-hpo-hackathon-august-2026/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 3d-web-work/dist/babylon-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
